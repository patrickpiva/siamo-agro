# Railway deployment configuration
# https://docs.railway.app/reference/config-as-code
#
# Two services share this repo — configure each in the Railway dashboard:
#
#   Service "api"
#     Start command : node apps/api/dist/index.js
#     Health check  : /health
#
#   Service "worker"
#     Start command : node apps/api/dist/worker.js
#     (no HTTP port — Railway does not healthcheck worker services)
#
# Both services use the same build below.
#
# ⚠️ App Sleeping: the [deploy] block sets sleepApplication=false for the API, but
#    the worker is configured in the dashboard and may not inherit it. Confirm
#    "App Sleeping" is OFF on BOTH services (Settings → App Sleeping), in BOTH
#    environments. Production must never sleep; a sleeping worker also delays
#    matchmaking jobs until it wakes.

[build]
builder = "DOCKERFILE"

# ─── API service (default) ────────────────────────────────────────────────────
# Override startCommand to "node apps/api/dist/worker.js" on the worker service.

[deploy]
startCommand = "node apps/api/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Keep the service always warm — no scale-to-zero. App Sleeping is what caused the
# ~3.3 s cold-start spikes on login + first-matches (Railway sleeps the idle service
# and cold-starts Node + a fresh Prisma connection on the next request).
numReplicas = 1
sleepApplication = false
